name: Auto-Generate Articles

on:
  schedule:
    - cron: '0 9 * * *'  # 9 AM UTC (10 AM Madrid)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run auto-generate script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: node scripts/auto-generate-articles.mjs

      - name: Create job summary
        if: always()
        run: |
          echo "## Auto-Generate Articles Workflow" >> $GITHUB_STEP_SUMMARY
          echo "✅ Ejecutado a las $(date)" >> $GITHUB_STEP_SUMMARY
